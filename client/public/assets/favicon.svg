<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Main gradient for the document background -->
    <linearGradient id="docGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <!-- Glowing gradient for AI elements -->
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E0F2FE" />
    </linearGradient>
    <!-- Shadow filter for premium look -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Document Body with Shadow -->
  <path d="M 128 80 C 128 57.9 145.9 40 168 40 H 296 L 384 128 V 432 C 384 454.1 366.1 472 344 472 H 168 C 145.9 472 128 454.1 128 432 V 80 Z" fill="url(#docGrad)" filter="url(#dropShadow)"/>

  <!-- Page Fold Corner (Top Right) -->
  <path d="M 296 40 V 104 C 296 117.3 306.7 128 320 128 H 384 L 296 40 Z" fill="#FFFFFF" fill-opacity="0.2" />
  <path d="M 296 40 L 384 128 H 320 C 306.7 128 296 117.3 296 104 V 40 Z" fill="#1E1B4B" fill-opacity="0.35" />

  <!-- Node Connections (AI Network) -->
  <path d="M 190 320 L 256 256 L 322 320" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="4" stroke-dasharray="6 6" stroke-linecap="round" />
  <path d="M 256 256 V 370" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="4" stroke-dasharray="6 6" stroke-linecap="round" />

  <!-- Central AI Sparkle -->
  <path d="M 256 150 C 256 208.5 297.5 250 356 250 C 297.5 250 256 291.5 256 350 C 256 291.5 214.5 250 156 250 C 214.5 250 256 208.5 256 150 Z" fill="url(#aiGrad)"/>

  <!-- Network Nodes (Circles) -->
  <circle cx="256" cy="256" r="10" fill="#FFFFFF" />
  <circle cx="190" cy="320" r="8" fill="#FFFFFF" />
  <circle cx="322" cy="320" r="8" fill="#FFFFFF" />
  <circle cx="256" cy="370" r="8" fill="#FFFFFF" />

  <!-- Small spark on top-right -->
  <path d="M 330 140 C 330 155 340 165 355 165 C 340 165 330 175 330 190 C 330 175 320 165 305 165 C 320 165 330 155 330 140 Z" fill="#FFFFFF" fill-opacity="0.85" />
</svg>
